<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1b4f72">
<title>Speech to Text — Fixed</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #eef3f9; min-height: 100vh;
    overscroll-behavior: none;
  }
  body { padding: 12px; padding-bottom: 24px; }

  h1 { font-size: 1.2rem; color: #0b2a3e; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  h1 .pill { font-size: 0.6rem; background: #1b4f72; color: #fff; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
  h1 .device { font-size: 0.55rem; background: #dbeafe; color: #1e40af; padding: 3px 8px; border-radius: 20px; font-weight: 700; text-transform: uppercase; }
  h1 .device.warn { background: #fef3c7; color: #92400e; }
  h1 .device.err { background: #fee2e2; color: #991b1b; }

  .sub { color: #4a6a85; font-size: 0.8rem; margin-bottom: 10px; line-height: 1.4; }

  .advisory {
    background: #fff8e6; border: 1.5px solid #f0d48a; color: #7a5500;
    border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;
    font-size: 0.78rem; line-height: 1.45; display: none;
  }
  .advisory.show { display: block; }
  .advisory.err { background: #ffefef; border-color: #e9a8a8; color: #8b2020; }
  .advisory.info { background: #eaf4fb; border-color: #9fc7e0; color: #0f4a6e; }
  .advisory strong { display: block; margin-bottom: 2px; font-size: 0.85rem; }

  .lang-bar { display: flex; gap: 6px; margin-bottom: 10px; background: #fff; padding: 6px; border-radius: 14px; border: 2px solid #d0dfee; }
  .lang-btn { flex: 1; padding: 8px 4px; font-size: 13px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; background: #eef3f9; color: #3a5b78; touch-action: manipulation; display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.2; }
  .lang-btn .native { font-size: 14px; }
  .lang-btn .code { font-size: 0.6rem; opacity: 0.7; }
  .lang-btn.active { background: #1b4f72; color: #fff; }

  .box { background: #fff; border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; border: 2px solid #d0dfee; }
  .box h3 { margin: 0 0 6px; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.6px; color: #3a5b78; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .box h3 .meta { font-size: 0.6rem; color: #7d95aa; font-weight: 500; text-transform: none; }
  #live, #saved { font-size: 1.05rem; line-height: 1.6; color: #102b3f; min-height: 2.2rem; max-height: 28vh; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  #live.interim { color: #1e5e7e; }
  #live.interim::after { content: '▍'; color: #1b4f72; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .placeholder { color: #8aa3b8; font-style: italic; }

  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  button { flex: 1 1 auto; padding: 14px 12px; font-size: 15px; font-weight: 600; border: none; border-radius: 12px; cursor: pointer; color: #fff; background: #1b4f72; touch-action: manipulation; min-height: 52px; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; }
  button.alt { background: #eaf1f9; color: #10344b; }
  button.red { background: #b13e3e; }
  button.green { background: #1f8a4c; }

  #status { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #225577; font-weight: 500; padding: 8px 12px; background: #fff; border-radius: 12px; border: 1px solid #d8e5f0; flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #9aaec2; flex-shrink: 0; }
  .dot.on { background: #2ecc71; animation: pulse 1.3s infinite; }
  .dot.warn { background: #e6a817; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  #log { background: #0d1b26; color: #6ee7a8; font-family: ui-monospace, monospace; font-size: 10px; padding: 10px; border-radius: 12px; white-space: pre-wrap; max-height: 150px; overflow-y: auto; margin-top: 8px; line-height: 1.5; }
  details summary { cursor: pointer; color: #4a6a85; font-size: 0.78rem; padding: 6px 0; }
</style>
</head>
<body>

  <h1>
    🎤 Speech to Text
    <span class="pill">FIXED</span>
    <span class="device" id="deviceBadge">detecting…</span>
  </h1>
  <div class="sub" id="deviceHint">Checking device…</div>

  <div class="advisory" id="advisory"></div>

  <div class="lang-bar" id="langBar">
    <button class="lang-btn active" data-lang="en-IN" data-code="en">
      <span class="native">English</span><span class="code">en-IN</span>
    </button>
    <button class="lang-btn" data-lang="bn-IN" data-code="bn">
      <span class="native">বাংলা</span><span class="code">bn-IN</span>
    </button>
    <button class="lang-btn" data-lang="hi-IN" data-code="hi">
      <span class="native">हिन्दी</span><span class="code">hi-IN</span>
    </button>
  </div>

  <div class="box">
    <h3><span>🔴 Live transcript</span><span class="meta" id="liveMeta">0 words · 0:00</span></h3>
    <div id="live" class="placeholder">Tap "Start" and speak…</div>
  </div>

  <div class="box">
    <h3><span>✅ Submitted</span><span class="meta" id="savedMeta"></span></h3>
    <div id="saved" class="placeholder">Submitted text appears here.</div>
  </div>

  <div class="btns">
    <button id="startBtn">▶ Start</button>
    <button id="stopBtn" class="alt" disabled>⏹ Stop</button>
  </div>
  <div class="btns">
    <button id="submitBtn" class="green">📥 Submit</button>
    <button id="copyBtn" class="alt">📋 Copy</button>
    <button id="clearBtn" class="red">🧹 Clear</button>
  </div>

  <div id="status">
    <span class="dot" id="dot"></span>
    <span id="statusTxt">idle</span>
  </div>

  <details>
    <summary>▸ Diagnostics</summary>
    <div id="log">Booting…</div>
  </details>

<script>
/* =====================================================================
   Speech-to-Text — FIXED MOBILE VERSION
   Complete rewrite with bulletproof restart + dedup logic.
   ===================================================================== */

const $ = id => document.getElementById(id);
const logEl = $('log'), liveEl = $('live'), savedEl = $('saved');
const liveMeta = $('liveMeta'), savedMeta = $('savedMeta');
const startBtn = $('startBtn'), stopBtn = $('stopBtn');
const submitBtn = $('submitBtn'), copyBtn = $('copyBtn'), clearBtn = $('clearBtn');
const dot = $('dot'), statusTxt = $('statusTxt');
const langBar = $('langBar');
const deviceBadge = $('deviceBadge');
const deviceHint = $('deviceHint');
const advisory = $('advisory');

function log(msg, cls) {
  const color = cls === 'err' ? '#ff8a8a' : cls === 'warn' ? '#ffd479' : cls === 'info' ? '#6ecfff' : '#6ee7a8';
  const time = new Date().toTimeString().slice(0, 8);
  logEl.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
  console.log('[STT]', msg);
}

/* ============ SIMPLE DEVICE DETECT ============ */
const ua = navigator.userAgent;
const isIOS = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
const isAndroid = /android/i.test(ua);
const isInApp = /fban|fbav|fb_iab|instagram|whatsapp|line\/|twitter|micromessenger|gsa\/|snapchat/i.test(ua) ||
                (isIOS && !/safari/i.test(ua) && !/crios|fxios/i.test(ua));
const isFirefox = /firefox|fxios/i.test(ua) && !/fxios/i.test(ua);
const hasSpeech = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
const isSecure = window.isSecureContext;

let deviceLabel = 'Mobile';
let deviceWarn = false;
if (!isSecure) { deviceLabel = 'insecure'; deviceWarn = true; }
else if (isInApp) { deviceLabel = 'in-app browser'; deviceWarn = true; }
else if (isFirefox) { deviceLabel = 'Firefox'; deviceWarn = true; }
else if (isIOS) { deviceLabel = 'iOS'; }
else if (isAndroid) { deviceLabel = 'Android'; }
else { deviceLabel = 'Desktop'; }

deviceBadge.textContent = deviceLabel;
deviceBadge.className = 'device' + (deviceWarn ? ' warn' : '');

// Advisory
if (!isSecure) {
  advisory.className = 'advisory err show';
  advisory.innerHTML = '<strong>⚠️ Not HTTPS</strong>Speech recognition requires a secure connection. Open via <code>https://</code> or <code>localhost</code>.';
} else if (isInApp) {
  advisory.className = 'advisory err show';
  advisory.innerHTML = '<strong>⚠️ In-app browser</strong>You opened this from Instagram, Facebook, WhatsApp, etc. Speech recognition does NOT work there. Tap ••• → <b>Open in Chrome</b> or <b>Open in Safari</b>.';
} else if (isFirefox) {
  advisory.className = 'advisory err show';
  advisory.innerHTML = '<strong>⚠️ Firefox not supported</strong>Please use Chrome, Edge, or Safari for speech recognition.';
} else if (isAndroid) {
  advisory.className = 'advisory info show';
  advisory.innerHTML = '<strong>ℹ️ Android tip</strong>Speak without long pauses. The mic restarts after ~5s of silence — your text is saved automatically.';
} else if (isIOS) {
  advisory.className = 'advisory info show';
  advisory.innerHTML = '<strong>ℹ️ iOS tip</strong>Works best in Safari. Chrome/Firefox on iOS use Safari engine but may be less accurate.';
}

if (!hasSpeech) {
  advisory.className = 'advisory err show';
  advisory.innerHTML = '<strong>⚠️ Speech API not available</strong>Your browser doesn\'t support speech recognition. Try Chrome, Edge, or Safari.';
}

deviceHint.innerHTML = isAndroid
  ? 'Speak continuously. Auto-restarts after silence.'
  : isIOS
    ? 'Speak naturally. Long sessions supported.'
    : 'Speak naturally.';

/* ============ CONFIG ============ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;

let listening = false;
let intentionalStop = false;
let isStarting = false;
let restartTimer = null;
let restartCount = 0;
let consecutiveFails = 0;

let currentLang = 'en-IN';
let currentCode = 'en';

let finalText = '';        // committed final text
let interimText = '';      // current interim
let sessionStartTime = null;
let totalSeconds = 0;
let timerInterval = null;

let wakeLock = null;

/* ============ TEXT HANDLING ============ */
function normalize(s) {
  return s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, '').replace(/\s+/g, ' ').trim();
}

function words(s) {
  return normalize(s).split(' ').filter(Boolean);
}

// Remove overlap between end of existing and start of new
function mergeText(existing, incoming) {
  if (!incoming) return existing;
  if (!existing) return incoming.trim();

  const a = words(existing);
  const b = words(incoming);
  if (!a.length) return incoming.trim();
  if (!b.length) return existing;

  // Find largest overlap
  const maxCheck = Math.min(a.length, b.length, 30);
  let bestOverlap = 0;

  for (let len = maxCheck; len >= 1; len--) {
    let match = true;
    for (let i = 0; i < len; i++) {
      if (a[a.length - len + i] !== b[i]) { match = false; break; }
    }
    if (match) { bestOverlap = len; break; }
  }

  if (bestOverlap === 0) {
    return (existing.trim() + ' ' + incoming.trim()).replace(/\s+/g, ' ').trim();
  }

  const remaining = b.slice(bestOverlap).join(' ');
  if (!remaining) return existing.trim();
  return (existing.trim() + ' ' + remaining).replace(/\s+/g, ' ').trim();
}

/* ============ DISPLAY ============ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function getFullText() {
  let t = finalText;
  if (interimText) t = (t + ' ' + interimText).trim();
  return t;
}

function render() {
  const full = getFullText();
  if (!full) {
    liveEl.textContent = 'Tap "Start" and speak…';
    liveEl.classList.add('placeholder');
    liveEl.classList.remove('interim');
  } else {
    liveEl.innerHTML = escapeHtml(full) + (interimText ? '<span style="color:#1b4f72">▍</span>' : '');
    liveEl.classList.remove('placeholder');
  }

  const wc = full ? full.split(/\s+/).filter(Boolean).length : 0;
  const secs = totalSeconds + (sessionStartTime ? Math.floor((Date.now() - sessionStartTime) / 1000) : 0);
  const m = Math.floor(secs / 60), s = secs % 60;
  liveMeta.textContent = wc + ' words · ' + m + ':' + String(s).padStart(2, '0');

  liveEl.scrollTop = liveEl.scrollHeight;
}

function setStatus(on, label, warn) {
  listening = on;
  dot.classList.toggle('on', on);
  dot.classList.toggle('warn', !!warn);
  statusTxt.textContent = label || (on ? 'listening' : 'idle');
  startBtn.disabled = on;
  stopBtn.disabled = !on;
}

/* ============ TIMER ============ */
function startTimer() {
  if (timerInterval) return;
  sessionStartTime = Date.now();
  timerInterval = setInterval(render, 1000);
}

function stopTimer() {
  if (sessionStartTime) {
    totalSeconds += Math.floor((Date.now() - sessionStartTime) / 1000);
    sessionStartTime = null;
  }
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

/* ============ KEEP AWAKE ============ */
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      log('🔆 wake lock');
    }
  } catch (e) {}
}

function releaseAwake() {
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}

/* ============ RECOGNIZER ============ */
function createRecognizer() {
  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.lang = currentLang;
  r.maxAlternatives = 1;

  r.onstart = () => {
    isStarting = false;
    consecutiveFails = 0;
    log('✅ Session started (lang=' + currentLang + ')', 'info');
    setStatus(true);
    if (!timerInterval) startTimer();
    render();
  };

  r.onresult = (e) => {
    let newFinal = '';
    let newInterim = '';

    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      const txt = res[0].transcript;
      if (res.isFinal) newFinal += txt;
      else newInterim += txt;
    }

    if (newInterim) {
      interimText = newInterim.trim();
    }

    if (newFinal.trim()) {
      const clean = newFinal.trim();
      const before = finalText;
      finalText = mergeText(finalText, clean);
      interimText = '';
      log('📝 +' + (finalText.length - before.length) + ' chars', 'info');
    }

    render();
  };

  r.onerror = (e) => {
    log('❌ error: ' + e.error, 'err');

    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      intentionalStop = true;
      listening = false;
      setStatus(false, 'mic blocked', true);
      advisory.className = 'advisory err show';
      advisory.innerHTML = '<strong>⚠️ Microphone blocked</strong>Tap the 🔒 icon in the address bar → Permissions → Microphone → Allow, then reload.';
      return;
    }

    if (e.error === 'no-speech') {
      // Normal — will auto-restart
      return;
    }

    if (e.error === 'audio-capture') {
      log('   → No microphone found', 'err');
    }

    if (e.error === 'network') {
      log('   → Network issue', 'warn');
    }
  };

  r.onend = () => {
    log('🔚 Session ended', 'info');

    if (!listening || intentionalStop) {
      // User stopped
      stopTimer();
      setStatus(false, 'idle');
      render();
      return;
    }

    // Auto-restart
    restartCount++;
    consecutiveFails++;

    if (consecutiveFails > 20) {
      log('⛔ Too many failures — stopping', 'err');
      intentionalStop = true;
      listening = false;
      setStatus(false, 'failed', true);
      return;
    }

    const delay = Math.min(300 + consecutiveFails * 200, 2000);
    log('↻ Restart #' + restartCount + ' in ' + delay + 'ms', 'warn');

    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => {
      if (listening && !intentionalStop) startRec();
    }, delay);
  };

  return r;
}

function startRec() {
  if (!rec || isStarting) return;
  isStarting = true;
  try {
    rec.start();
  } catch (err) {
    isStarting = false;
    if (err.name === 'InvalidStateError') {
      // Already started — try stopping then restarting
      try { rec.stop(); } catch (e) {}
      setTimeout(() => {
        if (listening && !intentionalStop) {
          try { rec.start(); isStarting = true; } catch (e) { isStarting = false; }
        }
      }, 500);
    } else {
      log('start() failed: ' + err.message, 'err');
      setTimeout(() => {
        if (listening && !intentionalStop) startRec();
      }, 1000);
    }
  }
}

/* ============ LANGUAGE ============ */
function setLanguage(lang, code, btn) {
  if (currentLang === lang) return;
  log('🌐 → ' + lang, 'info');

  Array.from(langBar.children).forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  currentLang = lang;
  currentCode = code;

  if (listening && rec) {
    intentionalStop = true;
    try { rec.stop(); } catch (e) {}
    setTimeout(() => {
      intentionalStop = false;
      rec = createRecognizer();
      startRec();
    }, 400);
  } else {
    if (rec) { try { rec.stop(); } catch (e) {} }
    rec = createRecognizer();
  }
}

Array.from(langBar.children).forEach(btn => {
  btn.addEventListener('click', () => setLanguage(btn.dataset.lang, btn.dataset.code, btn));
});

/* ============ BUTTONS ============ */
startBtn.onclick = async () => {
  if (!SR) {
    log('Speech API not supported', 'err');
    return;
  }

  log('=== START ===', 'info');
  intentionalStop = false;
  listening = true;
  isStarting = false;
  consecutiveFails = 0;
  restartCount = 0;

  // Request mic permission first
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
    log('✅ Mic permission granted');
  } catch (err) {
    log('❌ Mic denied: ' + err.name, 'err');
    listening = false;
    setStatus(false, 'blocked', true);
    advisory.className = 'advisory err show';
    advisory.innerHTML = '<strong>⚠️ Microphone blocked</strong>Tap the 🔒 icon in the address bar → Permissions → Microphone → Allow, then reload.';
    return;
  }

  await keepAwake();

  if (!rec) rec = createRecognizer();

  setStatus(true);
  startTimer();
  render();

  // Small delay to let UI update
  setTimeout(() => startRec(), 200);
};

stopBtn.onclick = () => {
  log('⏹ Stop', 'info');
  intentionalStop = true;
  listening = false;
  clearTimeout(restartTimer);
  if (rec) { try { rec.stop(); } catch (e) {} }
  stopTimer();
  releaseAwake();
  setStatus(false, 'idle');
  render();
};

submitBtn.onclick = () => {
  const text = getFullText();
  if (!text) {
    savedEl.textContent = '⚠️ Nothing to submit.';
    savedEl.classList.add('placeholder');
    return;
  }
  savedEl.textContent = text;
  savedEl.classList.remove('placeholder');
  const wc = text.split(/\s+/).filter(Boolean).length;
  savedMeta.textContent = wc + ' words · ' + text.length + ' chars';
  log('📥 Submitted (' + wc + ' words)', 'info');
};

copyBtn.onclick = async () => {
  const text = getFullText();
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    copyBtn.textContent = '✅ Copied';
    setTimeout(() => copyBtn.textContent = '📋 Copy', 1500);
  } catch (e) {
    log('❌ Clipboard: ' + e.message, 'err');
  }
};

clearBtn.onclick = () => {
  intentionalStop = true;
  listening = false;
  clearTimeout(restartTimer);
  if (rec) { try { rec.stop(); } catch (e) {} }
  finalText = '';
  interimText = '';
  restartCount = 0;
  consecutiveFails = 0;
  totalSeconds = 0;
  stopTimer();
  render();
  savedEl.textContent = 'Submitted text appears here.';
  savedEl.classList.add('placeholder');
  savedMeta.textContent = '';
  releaseAwake();
  setStatus(false, 'idle');
  log('🧹 Cleared', 'info');
};

/* ============ VISIBILITY ============ */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && listening) {
    log('⚠️ Tab hidden — recognition may pause', 'warn');
  } else if (!document.hidden && listening && rec) {
    log('👁 Tab visible — ensuring recognition', 'info');
    // Try to restart if it died while hidden
    setTimeout(() => {
      if (listening && !intentionalStop && !isStarting) {
        try { rec.start(); } catch (e) {}
      }
    }, 300);
  }
});

window.addEventListener('beforeunload', () => {
  if (rec && listening) { try { rec.stop(); } catch (e) {} }
  releaseAwake();
});

/* ============ INIT ============ */
if (!SR) {
  startBtn.disabled = true;
  log('Speech API NOT available', 'err');
} else {
  rec = createRecognizer();
  log('Speech API ready', 'info');
}

setStatus(false, 'idle');
render();
log('Ready.', 'info');
</script>
</body>
</html>
