<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speech to Text — runs until Stop</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0; padding: 16px;
    background: #f0f4fa; min-height: 100vh;
  }
  h1 { font-size: 1.4rem; color: #0b2a3e; margin: 0 0 4px; }
  .sub { color: #4a6a85; font-size: 0.9rem; margin-bottom: 16px; }
  .box {
    background: #fff; border-radius: 16px; padding: 16px;
    margin-bottom: 14px; border: 2px solid #d0dfee;
    box-shadow: 0 4px 12px rgba(20,50,80,0.06);
  }
  .box h3 {
    margin: 0 0 8px; font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.5px; color: #3a5b78;
  }
  #live, #saved {
    font-size: 1.15rem; line-height: 1.5; color: #102b3f;
    min-height: 3rem; white-space: pre-wrap; word-break: break-word;
  }
  #live.interim { color: #1e5e7e; font-style: italic; }
  .placeholder { color: #8aa3b8; font-style: italic; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    flex: 1 1 auto; padding: 14px 16px; font-size: 15px;
    font-weight: 600; border: none; border-radius: 12px;
    cursor: pointer; color: #fff; background: #1b4f72;
    transition: 0.15s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.45; }
  button.alt { background: #eaf1f9; color: #10344b; }
  button.red { background: #b13e3e; }
  #status {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.85rem; color: #225577; font-weight: 500;
    margin-top: 10px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #9aaec2;
  }
  .dot.on {
    background: #2ecc71;
    box-shadow: 0 0 0 4px rgba(46,204,113,0.25);
    animation: pulse 1.3s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.5; }
  }
  #log {
    background: #0d1b26; color: #6ee7a8; font-family: monospace;
    font-size: 12px; padding: 12px; border-radius: 12px;
    white-space: pre-wrap; max-height: 180px; overflow-y: auto;
    margin-top: 12px;
  }
</style>
</head>
<body>

  <h1>🎤 Speech to Text</h1>
  <div class="sub">Runs continuously until you tap <strong>Stop</strong>.</div>

  <div class="box">
    <h3>🔴 Live transcript</h3>
    <div id="live" class="placeholder">Tap "Start listening" and speak…</div>
  </div>

  <div class="box">
    <h3>✅ Submitted text</h3>
    <div id="saved" class="placeholder">Submitted text appears here.</div>
  </div>

  <div class="btns">
    <button id="startBtn">▶ Start listening</button>
    <button id="stopBtn" class="alt" disabled>⏹ Stop</button>
  </div>
  <div class="btns" style="margin-top:8px;">
    <button id="submitBtn">📥 Submit</button>
    <button id="clearBtn" class="red">🧹 Clear</button>
  </div>

  <div id="status"><span class="dot" id="dot"></span><span id="statusTxt">idle</span></div>

  <div id="log">Diagnostics…</div>

<script>
const logEl     = document.getElementById('log');
const liveEl    = document.getElementById('live');
const savedEl   = document.getElementById('saved');
const startBtn  = document.getElementById('startBtn');
const stopBtn   = document.getElementById('stopBtn');
const submitBtn = document.getElementById('submitBtn');
const clearBtn  = document.getElementById('clearBtn');
const dot       = document.getElementById('dot');
const statusTxt = document.getElementById('statusTxt');

function log(m) { logEl.textContent += '\n' + m; console.log(m); }

// ---------- Diagnostics ----------
log('Protocol: ' + location.protocol);
log('Secure context: ' + window.isSecureContext);
log('Host: ' + location.host);

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
log('SpeechRecognition: ' + (SR ? 'YES' : 'NO'));

if (!window.isSecureContext) log('❌ NOT SECURE — use https:// or localhost');
if (!SR) log('❌ Not supported. Use Chrome/Android or Safari/iOS.');

// ---------- State ----------
let rec = null;
let listening = false;          // is the user's intent "keep listening"?
let intentionalStop = false;    // true when user tapped Stop/Clear
let restarting = false;         // guard against double restarts
let finalText = '';
let interimText = '';

// ---------- UI ----------
function renderLive() {
  const combined = (finalText + (interimText ? ' ' + interimText : '')).trim();
  if (!combined) {
    liveEl.textContent = 'Tap "Start listening" and speak…';
    liveEl.classList.add('placeholder');
    liveEl.classList.remove('interim');
  } else {
    liveEl.textContent = combined;
    liveEl.classList.remove('placeholder');
    liveEl.classList.toggle('interim', interimText.length > 0);
  }
}

function setStatus(on, label) {
  listening = on;
  dot.classList.toggle('on', on);
  statusTxt.textContent = label || (on ? 'listening' : 'idle');
  startBtn.disabled = on;
  stopBtn.disabled = !on;
}

// ---------- Build recognizer ----------
if (SR) {
  rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = 'en-US';   // change to 'en-IN' if needed

  rec.onstart = () => {
    restarting = false;
    log('✅ onstart');
    if (listening) setStatus(true, 'listening');
  };

  rec.onspeechstart = () => log('🗣 speech detected');
  rec.onspeechend    = () => log('🤐 speech ended');

  rec.onresult = (e) => {
    let f = '', i = '';
    for (let k = 0; k < e.results.length; k++) {
      const t = e.results[k][0].transcript;
      if (e.results[k].isFinal) f += t;
      else i += t;
    }
    finalText = f;
    interimText = i;
    renderLive();
  };

  rec.onerror = (e) => {
    log('❌ onerror: ' + e.error);
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      // permission problem — stop trying
      intentionalStop = true;
      listening = false;
      setStatus(false, 'mic blocked');
      log('   → Permission blocked. Cannot continue.');
    }
    if (e.error === 'audio-capture') log('   → No microphone found.');
    if (e.error === 'network')       log('   → Network error to speech service.');
    // 'no-speech' — ignore, we'll auto-restart
  };

  rec.onend = () => {
    log('🔚 onend');
    // KEY FIX: if user still wants to listen, restart automatically.
    if (listening && !intentionalStop) {
      log('↻ restarting (silence timeout)…');
      restarting = true;
      // tiny delay helps mobile browsers
      setTimeout(() => {
        if (!listening || intentionalStop) return;
        try {
          rec.start();
        } catch (err) {
          log('❌ restart failed: ' + err.name + ' — trying again');
          // try one more time after a longer delay
          setTimeout(() => {
            if (listening && !intentionalStop) {
              try { rec.start(); } catch(e) { log('❌ give up: ' + e.name); }
            }
          }, 600);
        }
      }, 250);
    } else {
      // user-initiated stop
      setStatus(false, 'idle');
      interimText = '';
      renderLive();
    }
  };
}

// ---------- Buttons ----------
startBtn.onclick = async () => {
  if (!rec) return;
  log('--- Start tapped ---');

  intentionalStop = false;
  listening = true;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    log('✅ Permission granted');
    stream.getTracks().forEach(t => t.stop());

    // give a small gap so the mic is released, then start
    setTimeout(() => {
      if (!listening) return;
      try {
        rec.start();
        setStatus(true, 'listening');
      } catch (err) {
        log('❌ start threw: ' + err.name);
        if (err.name === 'InvalidStateError') {
          try { rec.stop(); } catch(e){}
          setTimeout(() => { if (listening) rec.start(); }, 400);
        }
      }
    }, 150);

  } catch (err) {
    log('❌ getUserMedia failed: ' + err.name);
    log('   ' + err.message);
    if (err.name === 'NotAllowedError')
      log('   → Blocked. Tap 🔒 in address bar → allow Microphone → reload.');
    listening = false;
    setStatus(false, 'mic blocked');
  }
};

stopBtn.onclick = () => {
  log('⏹ Stop tapped — will not restart.');
  intentionalStop = true;
  listening = false;
  if (rec) { try { rec.stop(); } catch(e){} }
  setStatus(false, 'idle');
  interimText = '';
  renderLive();
};

submitBtn.onclick = () => {
  const combined = (finalText + (interimText ? ' ' + interimText : '')).trim();
  if (!combined) {
    savedEl.textContent = '⚠️ Nothing to submit — speak first.';
    savedEl.classList.add('placeholder');
    return;
  }
  savedEl.textContent = combined;
  savedEl.classList.remove('placeholder');
  log('📥 Submitted ' + combined.length + ' chars');
};

clearBtn.onclick = () => {
  intentionalStop = true;
  listening = false;
  if (rec) { try { rec.stop(); } catch(e){} }
  finalText = ''; interimText = '';
  renderLive();
  savedEl.textContent = 'Submitted text appears here.';
  savedEl.classList.add('placeholder');
  setStatus(false, 'idle');
  log('🧹 Cleared');
};

setStatus(false, 'idle');
renderLive();
</script>
</body>
</html>
